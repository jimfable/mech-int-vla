version: 1
group_key: [suite, task_id, base_init_state_id]
splits:
  discovery:
    init_state_ids: {start: 0, stop_inclusive: 9}
    seed_base: 100000
  calibration:
    init_state_ids: {start: 10, stop_inclusive: 29}
    seed_base: 200000
  locked_test:
    init_state_ids: {start: 30, stop_inclusive: 49}
    seed_base: 300000
seed_formula: "seed_base + task_rank*1000 + base_init_state_id*10 + condition_index"
policy_execution:
  control_mode: relative
  max_steps: 520
  reset_noop_steps: 10
  n_action_steps: 1
scoring:
  full_score_stride_steps: 5
  primary_steps: [0, 50, 100, 150, 200]
bootstrap:
  cluster: base_init_state_id
  replicates: 10000
  interval: 0.90
  seed: 260803
calibration_guard:
  required_file: locks/reality_gate_frozen.json
  required_tag: prereg-locked-v1
  require_clean_worktree: true
locked_test_guard:
  required_file: locks/calibration_frozen.json
  required_tag: calibration-locked-v1
  require_clean_worktree: true
calibration_selection:
  representation_candidates:
    - vlm_context
    - early_expert_t1_0
    - early_expert_t0_5
    - late_expert_t1_0
    - late_expert_t0_5
  ridge_alpha_candidates: [0.0001, 0.001, 0.01, 0.1, 1, 10, 100]
  patch_strength_candidates: [0.25, 0.5, 1.0]
  predictor_candidates:
    logistic_regression:
      C: [0.01, 0.1, 1, 10, 100]
    histogram_gradient_boosting:
      learning_rate: [0.03, 0.1]
      max_leaf_nodes: [7, 15]
      min_samples_leaf: [10, 20]
      l2_regularization: [0, 1]
      max_iter_min: 1
      max_iter_max: 200
