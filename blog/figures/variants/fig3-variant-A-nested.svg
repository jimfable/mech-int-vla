<svg xmlns="http://www.w3.org/2000/svg" width="680" height="344" viewBox="0 0 680 344" role="img" aria-label="Three nested boxes. The innermost holds the robot&#x27;s own plans, the middle one adds the exact scene state from the simulator, the outer one adds 8 signals from inside the network." font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-rendering="geometricPrecision"><rect width="680" height="344" fill="#ffffff"/><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#1c1c1c"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#b9b9b9"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#2f6db3"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#d4582b"/></marker><marker id="ah-text2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#6a6a6a"/></marker><marker id="ah-out" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#8f8f8f"/></marker></defs><text x="24.00" y="30.00" font-size="15" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">3</text><text x="41.50" y="30.00" font-size="15" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Each monitor sees everything the previous one sees</text><text x="24.00" y="52.00" font-size="13" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Variant A: nested boxes</text><rect x="24.00" y="72.00" width="632.00" height="236.00" rx="8" fill="#f7f9fc" stroke="#2f6db3" stroke-width="1.4"/><text x="40.00" y="102.00" font-size="13" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan fill="#2f6db3" font-weight="700">+ Internals</tspan><tspan fill="#6a6a6a">   8 signals from 720 internal numbers</tspan></text><rect x="596.0" y="88.0" width="7" height="10" fill="#2f6db3" fill-opacity="0.9"/><rect x="604.0" y="88.0" width="7" height="10" fill="#2f6db3" fill-opacity="0.35"/><rect x="612.0" y="88.0" width="7" height="10" fill="#2f6db3" fill-opacity="0.6"/><rect x="620.0" y="88.0" width="7" height="10" fill="#2f6db3" fill-opacity="0.15"/><rect x="628.0" y="88.0" width="7" height="10" fill="#2f6db3" fill-opacity="0.75"/><rect x="596.0" y="100.0" width="7" height="10" fill="#2f6db3" fill-opacity="0.45"/><rect x="604.0" y="100.0" width="7" height="10" fill="#2f6db3" fill-opacity="0.25"/><rect x="612.0" y="100.0" width="7" height="10" fill="#2f6db3" fill-opacity="0.85"/><rect x="620.0" y="100.0" width="7" height="10" fill="#2f6db3" fill-opacity="0.5"/><rect x="628.0" y="100.0" width="7" height="10" fill="#2f6db3" fill-opacity="0.3"/><text x="636.00" y="120.00" font-size="11" fill="#2f6db3" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">…</text><rect x="44.00" y="128.00" width="592.00" height="160.00" rx="8" fill="#f6f6f6" stroke="#1c1c1c" stroke-width="1.4"/><text x="60.00" y="158.00" font-size="13" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan fill="#1c1c1c" font-weight="700">+ Simulator</tspan><tspan fill="#6a6a6a">   exact scene state: poses, contact, stage</tspan></text><rect x="577.00" y="137.00" width="38.00" height="38.00" rx="0" fill="none" stroke="#1c1c1c" stroke-width="1.1"/><line x1="577.00" y1="162.00" x2="615.00" y2="162.00" stroke="#b9b9b9" stroke-width="0.8" stroke-linecap="butt" stroke-dasharray="2 2"/><line x1="591.00" y1="137.00" x2="591.00" y2="175.00" stroke="#b9b9b9" stroke-width="0.8" stroke-linecap="butt" stroke-dasharray="2 2"/><rect x="586" y="157" width="10" height="10" fill="#1c1c1c" transform="rotate(-30 591 162)"/><rect x="600.00" y="142.00" width="12.00" height="8.00" rx="0" fill="none" stroke="#1c1c1c" stroke-width="1.1"/><circle cx="606.00" cy="166.00" r="2.6" fill="#1c1c1c" stroke="none" stroke-width="1.0"/><rect x="64.00" y="184.00" width="552.00" height="84.00" rx="8" fill="#ffffff" stroke="#8f8f8f" stroke-width="1.4"/><text x="80.00" y="214.00" font-size="13" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan fill="#6f6f6f" font-weight="700">Outputs</tspan><tspan fill="#6a6a6a">   the robot’s own plans and how they shift</tspan></text><path d="M560,226 C570,222 576,204 592,200" stroke="#8f8f8f" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-out)"/><path d="M560,226 C572,224 582,212 594,212" stroke="#8f8f8f" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="560.00" cy="226.00" r="2.6" fill="#8f8f8f" stroke="none" stroke-width="1.0"/><text x="340.00" y="332.00" font-size="12.5" fill="#1c1c1c" text-anchor="middle" font-weight="600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Main question: does the outer box beat the middle one?</text></svg>