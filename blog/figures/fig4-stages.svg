<svg xmlns="http://www.w3.org/2000/svg" width="680" height="216" viewBox="0 0 680 216" role="img" aria-label="Three stages on separate starting scenes: discovery on 10 scenes, calibration on 20, and a test on 20 new scenes that was collected only after every setting was frozen." font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-rendering="geometricPrecision"><rect width="680" height="216" fill="#ffffff"/><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#1c1c1c"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#b9b9b9"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#2f6db3"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#d4582b"/></marker><marker id="ah-text2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#6a6a6a"/></marker><marker id="ah-out" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#8f8f8f"/></marker></defs><text x="24.00" y="30.00" font-size="15" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">4</text><text x="41.50" y="30.00" font-size="15" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Three stages, kept apart</text><text x="24.00" y="52.00" font-size="13" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Every stage uses its own starting scenes</text><rect x="24.00" y="82.00" width="116.00" height="56.00" rx="5" fill="#f4f4f4" stroke="none" stroke-width="1.6"/><text x="38.00" y="106.00" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Discovery</text><text x="38.00" y="124.00" font-size="12" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">10 scenes · 40 runs</text><text x="26.00" y="164.00" font-size="12" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">get the robot running</text><text x="26.00" y="182.00" font-size="12" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">check the failure rate</text><line x1="144.00" y1="110.00" x2="162.00" y2="110.00" stroke="#1c1c1c" stroke-width="1.0" stroke-linecap="butt" marker-end="url(#ah-ink)"/><rect x="166.00" y="82.00" width="232.00" height="56.00" rx="5" fill="#f4f4f4" stroke="none" stroke-width="1.6"/><text x="180.00" y="106.00" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Calibration</text><text x="180.00" y="124.00" font-size="12" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">20 scenes · 160 runs</text><text x="168.00" y="164.00" font-size="12" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">build the internal signals</text><text x="168.00" y="182.00" font-size="12" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">train the monitors</text><text x="168.00" y="200.00" font-size="12" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">freeze every setting</text><line x1="402.00" y1="110.00" x2="420.00" y2="110.00" stroke="#1c1c1c" stroke-width="1.0" stroke-linecap="butt" marker-end="url(#ah-ink)"/><rect x="424.00" y="82.00" width="232.00" height="56.00" rx="5" fill="#ffffff" stroke="#1c1c1c" stroke-width="1.6"/><text x="438.00" y="106.00" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Test</text><text x="438.00" y="124.00" font-size="12" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">20 new scenes · 160 runs</text><text x="426.00" y="164.00" font-size="12" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">new angles, shifts, camera turns</text><text x="426.00" y="182.00" font-size="12" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">collected after the freeze</text><text x="426.00" y="200.00" font-size="12" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">main comparison computed once</text><path d="M406.0,68 L406.0,63 A5,5 0 0 1 416.0,63 L416.0,68" stroke="#1c1c1c" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="403.00" y="68.00" width="16.00" height="12.00" rx="2" fill="#1c1c1c" stroke="none" stroke-width="1.0"/><text x="411.00" y="50.00" font-size="12" fill="#1c1c1c" text-anchor="middle" font-weight="600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">freeze</text></svg>