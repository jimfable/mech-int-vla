<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" aria-label="SmolVLA drawn bottom to top. Camera images, instruction and joint readings enter a 16-layer vision-language model. Each of the 16 action-expert layers reads the matching vision-language layer. Random noise enters the action expert at the bottom and 50 planned movements leave at the top; the plan goes round 10 times. The probe reads and the edit writes after layer 4 of the action expert, in the first pass." font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-rendering="geometricPrecision"><rect width="680" height="470" fill="#ffffff"/><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#1c1c1c"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#b9b9b9"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#2f6db3"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#d4582b"/></marker><marker id="ah-text2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#6a6a6a"/></marker><marker id="ah-out" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#8f8f8f"/></marker></defs><text x="24.00" y="30.00" font-size="15" fi