<svg xmlns="http://www.w3.org/2000/svg" width="680" height="342" viewBox="0 0 680 342" role="img" aria-label="Top-down sketch. The gripper approaches the book. If the network used the probe reading, writing the partner&#x27;s angle would turn the planned approach toward the partner&#x27;s book angle. Measured: it changed no more than after a random edit." font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-rendering="geometricPrecision"><rect width="680" height="342" fill="#ffffff"/><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#1c1c1c"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#b9b9b9"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#2f6db3"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#d4582b"/></marker><marker id="ah-text2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#6a6a6a"/></marker><marker id="ah-out" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#8f8f8f"/></marker></defs><text x="24.00" y="30.00" font-size="15" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">8</text><text x="41.50" y="30.00" font-size="15" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">What the edit should do if the network used the reading</text><text x="24.00" y="52.00" font-size="13" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Variant C: seen from above (sketch)</text><text x="190.00" y="88.00" font-size="13" fill="#1c1c1c" text-anchor="middle" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">If the network used the reading</text><rect x="178" y="142" width="24" height="72" fill="#1c1c1c" transform="rotate(10 190 178)"/><rect x="178" y="142" width="24" height="72" fill="none" stroke="#d4582b" stroke-dasharray="4 3" stroke-width="1.6" transform="rotate(60 190 178)"/><line x1="90.00" y1="248.00" x2="164.00" y2="200.00" stroke="#1c1c1c" stroke-width="1.8" stroke-linecap="butt" marker-end="url(#ah-ink)"/><path d="M90,248 Q140,244 176,220" stroke="#d4582b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 3" marker-end="url(#ah-orange)"/><text x="190.00" y="282.00" font-size="12" fill="#d4582b" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">the approach turns toward</text><text x="190.00" y="298.00" font-size="12" fill="#d4582b" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">the partner’s angle</text><text x="500.00" y="88.00" font-size="13" fill="#1c1c1c" text-anchor="middle" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">What happened</text><rect x="488" y="142" width="24" height="72" fill="#1c1c1c" transform="rotate(10 500 178)"/><rect x="488" y="142" width="24" height="72" fill="none" stroke="#d4582b" stroke-dasharray="4 3" stroke-width="1.6" transform="rotate(60 500 178)"/><line x1="400.00" y1="248.00" x2="474.00" y2="200.00" stroke="#1c1c1c" stroke-width="1.8" stroke-linecap="butt" marker-end="url(#ah-ink)"/><text x="500.00" y="282.00" font-size="12" fill="#6a6a6a" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">the approach changes no more</text><text x="500.00" y="298.00" font-size="12" fill="#6a6a6a" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">than after a random edit</text><text x="24.00" y="332.00" font-size="11.5" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">black: the real book · dashed: the partner’s book angle · arrow: planned approach</text></svg>