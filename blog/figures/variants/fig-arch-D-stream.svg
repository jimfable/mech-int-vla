<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" aria-label="The action expert of SmolVLA drawn as a residual stream from bottom to top. Random noise for 50 movement tokens enters at the bottom; each of the 16 layers reads from the stream and adds its result back. The layers also read a context that the vision-language model computes once from the camera images, the instruction and the joint readings. At the top comes a small update to the 50 planned movements; the whole stack runs 10 times. The probe reads and the edit writes on the stream after layer 4, in the first of the 10 passes." font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-rendering="geometricPrecision"><rect width="680" height="520" fill="#ffffff"/><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#1c1c1c"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#b9b9b9"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#2f6db3"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#d4582b"/></marker><marker id="ah-text2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#6a6a6a"/></marker><marker id="ah-out" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6,0.8 L9.4,5 L0.6,9.2 Z" fill="#8f8f8f"/></marker></defs><text x="24.00" y="30.00" font-size="15" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">8</text><text x="41.50" y="30.00" font-size="15" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Where the probe reads and the edit writes</text><text x="24.00" y="52.00" font-size="13" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">The action expert as one stream of numbers, from bottom to top</text><line x1="262.00" y1="462.00" x2="262.00" y2="104.00" stroke="#1c1c1c" stroke-width="2.2" stroke-linecap="butt"/><polygon points="256,106 268,106 262,96" fill="#1c1c1c"/><text x="262.00" y="484.00" font-size="12" fill="#1c1c1c" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">random noise for the 50 movement tokens</text><text x="262.00" y="74.00" font-size="12" fill="#1c1c1c" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">a small update to the 50 planned</text><text x="262.00" y="89.00" font-size="12" fill="#1c1c1c" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">movements (after pass 10: the plan)</text><text x="272.00" y="458.00" font-size="11" fill="#6a6a6a" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">720 numbers per token</text><rect x="300.00" y="410.00" width="84.00" height="22.00" rx="4" fill="#f4f4f4" stroke="none" stroke-width="1.0"/><text x="342.00" y="425.00" font-size="11.5" fill="#1c1c1c" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">layer 1</text><line x1="264.00" y1="427.00" x2="297.00" y2="427.00" stroke="#b9b9b9" stroke-width="1.1" stroke-linecap="butt" marker-end="url(#ah-muted)"/><line x1="298.00" y1="415.00" x2="271.00" y2="415.00" st